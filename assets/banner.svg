<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Conductor — AI Browser Agent &amp; MCP Tools">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a2138"/>
      <stop offset="0.55" stop-color="#081726"/>
      <stop offset="1" stop-color="#061120"/>
    </linearGradient>
    <linearGradient id="baton" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd97a"/>
      <stop offset="1" stop-color="#f5b93f"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="360" fill="url(#bg)"/>
  <rect x="6" y="6" width="1268" height="348" rx="26" fill="none" stroke="#2dd3be" stroke-opacity="0.55" stroke-width="3"/>

  <!-- baton motif (echoes the extension icon) -->
  <g transform="translate(150,90)">
    <rect x="-58" y="-58" width="196" height="196" rx="34" fill="#081726" stroke="#2dd3be" stroke-width="5"/>
    <path d="M -6 44 A 60 60 0 0 1 44 -6" fill="none" stroke="#2dd3be" stroke-width="9" stroke-linecap="round"/>
    <path d="M -22 62 A 92 92 0 0 1 62 -22" fill="none" stroke="#2dd3be" stroke-width="9" stroke-linecap="round" opacity="0.75"/>
    <circle cx="-16" cy="54" r="11" fill="#081726" stroke="#2dd3be" stroke-width="6"/>
    <line x1="-8" y1="46" x2="52" y2="86" stroke="url(#baton)" stroke-width="10" stroke-linecap="round"/>
    <circle cx="58" cy="90" r="13" fill="#f5b93f"/>
    <circle cx="76" cy="6" r="8" fill="#081726" stroke="#f5b93f" stroke-width="5"/>
    <circle cx="-34" cy="-2" r="8" fill="#081726" stroke="#f5b93f" stroke-width="5"/>
  </g>

  <!-- title block -->
  <text x="310" y="158" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="86" font-weight="700" letter-spacing="10" fill="#ffffff">CONDUCTOR</text>
  <text x="314" y="208" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="31" fill="#2dd3be">AI Browser Agent &amp; MCP Tools</text>
  <text x="314" y="252" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="25" fill="#c9d6e2">Turn any website into MCP tools — and drive it by chat.</text>

  <!-- feature chips -->
  <g font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" fill="#eaf4f1">
    <rect x="314" y="282" width="238" height="42" rx="21" fill="#0e2f3d" stroke="#2dd3be" stroke-opacity="0.7"/>
    <text x="338" y="310">Local-first · Ollama</text>
    <rect x="568" y="282" width="262" height="42" rx="21" fill="#0e2f3d" stroke="#2dd3be" stroke-opacity="0.7"/>
    <text x="592" y="310">Writes ask first · gated</text>
    <rect x="846" y="282" width="212" height="42" rx="21" fill="#0e2f3d" stroke="#2dd3be" stroke-opacity="0.7"/>
    <text x="870" y="310">MCP bridge :8787</text>
  </g>

  <!-- price tag -->
  <g transform="translate(1196,54)">
    <circle r="34" fill="#f5b93f"/>
    <text y="-2" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" font-weight="700" fill="#081726">FREE</text>
    <text y="18" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#081726">BETA</text>
  </g>
</svg>
