<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="560" viewBox="0 0 1240 560" role="img" aria-label="Conductor architecture: browser tab to Conductor to tools to chat and MCP bridge to MCP clients, with approval gate">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2dd3be"/>
    </marker>
    <marker id="arrGold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f5b93f"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="560" fill="#081726"/>
  <rect x="6" y="6" width="1228" height="548" rx="22" fill="none" stroke="#2dd3be" stroke-opacity="0.45" stroke-width="3"/>

  <text x="620" y="48" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="26" font-weight="700" letter-spacing="3" fill="#ffffff">HOW CONDUCTOR WORKS</text>

  <!-- 1: browser tab -->
  <g>
    <rect x="40" y="120" width="230" height="150" rx="16" fill="#0e2f3d" stroke="#2dd3be" stroke-width="2"/>
    <text x="155" y="158" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" fill="#ffffff">ANY WEBSITE</text>
    <text x="155" y="186" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#c9d6e2">your logged-in tab</text>
    <text x="155" y="216" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb4c6">forms · tables · buttons</text>
    <text x="155" y="240" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb4c6">WebMCP · site APIs</text>
  </g>

  <!-- arrow 1 -->
  <line x1="272" y1="195" x2="318" y2="195" stroke="#2dd3be" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 2: conductor core -->
  <g>
    <rect x="322" y="84" width="330" height="330" rx="16" fill="#0a2138" stroke="#f5b93f" stroke-width="2.5"/>
    <text x="487" y="122" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="2" fill="#f5b93f">CONDUCTOR</text>
    <rect x="346" y="140" width="282" height="52" rx="10" fill="#0e2f3d"/>
    <text x="487" y="163" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#ffffff">① Native WebMCP detection</text>
    <text x="487" y="184" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9fb4c6">navigator.modelContext + form tools</text>
    <rect x="346" y="202" width="282" height="52" rx="10" fill="#0e2f3d"/>
    <text x="487" y="225" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#ffffff">② Tool synthesis from the page</text>
    <text x="487" y="246" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9fb4c6">typed tools from real DOM schemas</text>
    <rect x="346" y="264" width="282" height="52" rx="10" fill="#0e2f3d"/>
    <text x="487" y="287" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="600" fill="#ffffff">③ API import (OpenAPI)</text>
    <text x="487" y="308" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#9fb4c6">API Lens captures → tools, in your session</text>
    <rect x="346" y="330" width="282" height="62" rx="10" fill="#123a2a" stroke="#2dd3be" stroke-opacity="0.6"/>
    <text x="487" y="356" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" font-weight="700" fill="#2dd3be">🛡 APPROVAL GATE</text>
    <text x="487" y="379" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13" fill="#c9d6e2">reads run free · every write asks first</text>
  </g>

  <!-- arrow 2 (to chat) -->
  <line x1="654" y1="160" x2="700" y2="160" stroke="#2dd3be" stroke-width="3" marker-end="url(#arr)"/>
  <!-- arrow 3 (to bridge) -->
  <line x1="654" y1="330" x2="700" y2="330" stroke="#2dd3be" stroke-width="3" marker-end="url(#arr)"/>

  <!-- 3a: chat -->
  <g>
    <rect x="704" y="96" width="240" height="130" rx="16" fill="#0e2f3d" stroke="#2dd3be" stroke-width="2"/>
    <text x="824" y="134" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">CHAT PANEL</text>
    <text x="824" y="162" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d6e2">side panel + Big Workspace</text>
    <text x="824" y="186" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb4c6">Scanner · Skills · Vault</text>
    <text x="824" y="210" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb4c6">Activity log</text>
  </g>

  <!-- 3b: bridge -->
  <g>
    <rect x="704" y="268" width="240" height="130" rx="16" fill="#0e2f3d" stroke="#2dd3be" stroke-width="2"/>
    <text x="824" y="306" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">MCP BRIDGE</text>
    <text x="824" y="334" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d6e2">local · 127.0.0.1:8787</text>
    <text x="824" y="358" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb4c6">writes refused by default</text>
    <text x="824" y="382" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb4c6">proxies local model calls only</text>
  </g>

  <!-- arrow 4 -->
  <line x1="946" y1="330" x2="992" y2="330" stroke="#f5b93f" stroke-width="3" marker-end="url(#arrGold)"/>

  <!-- 4: MCP clients -->
  <g>
    <rect x="996" y="268" width="204" height="130" rx="16" fill="#0a2138" stroke="#f5b93f" stroke-width="2"/>
    <text x="1098" y="306" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="20" font-weight="700" fill="#ffffff">MCP CLIENTS</text>
    <text x="1098" y="334" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d6e2">Hermes · Claude</text>
    <text x="1098" y="358" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#c9d6e2">your own agents</text>
    <text x="1098" y="382" text-anchor="middle" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="15" fill="#9fb4c6">drive your real session</text>
  </g>

  <!-- model routing strip -->
  <g>
    <rect x="40" y="452" width="1160" height="72" rx="14" fill="#0e2f3d" stroke="#2dd3be" stroke-opacity="0.6"/>
    <text x="70" y="482" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="17" font-weight="700" fill="#2dd3be">MODEL ROUTING — LOCAL-FIRST</text>
    <text x="70" y="508" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="16" fill="#c9d6e2">Default: Ollama on your machine (page content never leaves) · Optional: OpenRouter with your own key · No silent cloud fallback — ever</text>
  </g>
</svg>
